<h2 mat-dialog-title>Xác nhận</h2>
<mat-dialog-content>Bạn có chắc muốn thêm sản phẩm vào giỏ hàng?</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Không</button>
  <button mat-button color="primary" (click)="confirm()">Có</button>
</mat-dialog-actions>
